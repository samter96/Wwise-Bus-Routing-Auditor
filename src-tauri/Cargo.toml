[package]
name = "bus-routing-auditor"
version = "2.0.0"
description = "Wwise bus routing integrity auditor"
authors = ["Bus Routing Auditor"]
edition = "2021"

[lib]
name = "bus_routing_auditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
